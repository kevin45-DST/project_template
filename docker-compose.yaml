services:

  # =============================================================================
  # Application
  # =============================================================================

  hephaistos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: docker

    container_name: hephaistos

    depends_on:
      - mlflow
      - elasticsearch

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./reports:/app/reports

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ELASTICSEARCH_HOST: http://elasticsearch:9200


  # =============================================================================
  # MLflow
  # =============================================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1

    container_name: mlflow

    ports:
      - "5000:5000"

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow:5000,localhost:*"
      --backend-store-uri sqlite:///mlflow.db
      --artifacts-destination /mlflow/artifacts

    volumes:
      - ./mlflow:/mlflow
      - ./reports:/app/reports


  # =============================================================================
  # Elasticsearch
  # =============================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0

    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data


  # =============================================================================
  # Kibana
  # =============================================================================

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.0

    container_name: kibana

    depends_on:
      - elasticsearch

    ports:
      - "5601:5601"

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200


# ===============================================================================
# Volumes
# ===============================================================================

volumes:

  elasticsearch_data: